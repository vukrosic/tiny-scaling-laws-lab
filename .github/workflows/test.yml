name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python setup_dependencies.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Prepare wrapper environment
        run: python -m venv --system-site-packages .venv
      - name: Check the public command on macOS and Linux
        if: runner.os != 'Windows'
        run: ./first_win.sh --widths 4,6,8 --seeds 1 --pretrain-steps 2 --rl-steps 2 --batch-size 4 --image smoke.png --receipt smoke.json --no-open
      - name: Check the public command on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: first_win.bat --widths 4,6,8 --seeds 1 --pretrain-steps 2 --rl-steps 2 --batch-size 4 --image smoke.png --receipt smoke.json --no-open
